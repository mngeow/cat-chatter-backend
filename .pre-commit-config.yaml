repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: uvx ruff format
        language: system
        types_or: [python]
        pass_filenames: true

      - id: ruff-check
        name: ruff-check
        entry: uvx ruff check --force-exclude
        language: system
        types_or: [python]
        pass_filenames: true
